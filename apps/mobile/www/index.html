<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VisaHobe — Immigration Operating System</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D3B2E" />
    <meta name="color-scheme" content="light" />
    <style>
      :root {
        --color-brand-emerald: #0d3b2e;
        --color-brand-emerald-hover: #092a21;
        --color-brand-emerald-accent: #145342;
        --color-surface-white: #ffffff;
        --color-surface-muted: #f8fafc;
        --color-text-primary: #0f172a;
        --color-text-secondary: #475569;
        --color-border-subtle: #e2e8f0;
        --glass-bg: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(255, 255, 255, 0.95);
        --glass-shadow: 0 20px 40px -15px rgba(13, 59, 46, 0.12), 0 0 0 1px rgba(13, 59, 46, 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        color: var(--color-text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .mobile-container {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Liquid Glass Container */
      .glass-card {
        width: 100%;
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        padding: 36px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(13, 59, 46, 0.06);
        border: 1px solid rgba(13, 59, 46, 0.15);
        border-radius: 9999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--color-brand-emerald);
        margin-bottom: 24px;
      }

      .brand-badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-brand-emerald);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .logo-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: var(--color-brand-emerald);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        box-shadow: 0 10px 25px -5px rgba(13, 59, 46, 0.35);
        margin-bottom: 20px;
      }

      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--color-brand-emerald);
        margin-bottom: 8px;
      }

      p.subtitle {
        font-size: 14px;
        color: var(--color-text-secondary);
        line-height: 1.5;
        margin-bottom: 28px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        background: #f1f5f9;
        color: #475569;
        margin-bottom: 24px;
      }

      .retry-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 14px;
        border: none;
        background: var(--color-brand-emerald);
        color: #ffffff;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
        box-shadow: 0 4px 12px rgba(13, 59, 46, 0.2);
      }

      .retry-button:hover {
        background: var(--color-brand-emerald-hover);
      }

      .retry-button:active {
        transform: scale(0.98);
      }

      .footer-note {
        margin-top: 24px;
        font-size: 12px;
        color: #94a3b8;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <main class="mobile-container">
      <div class="glass-card">
        <div class="brand-badge">
          <span class="brand-badge-dot"></span>
          VisaHobe Mobile
        </div>

        <div class="logo-icon" aria-hidden="true">V</div>

        <h1>Connecting to VisaHobe</h1>
        <p class="subtitle">
          Your secure immigration portal is establishing a high-assurance session with the platform.
        </p>

        <div id="statusPill" class="status-pill">Checking network availability...</div>

        <button id="retryBtn" class="retry-button" type="button" onclick="retryConnection()">
          Retry Connection
        </button>
      </div>

      <div class="footer-note">Protected by ISO 27001 & SOC 2 Type II Encrypted Enclave</div>
    </main>

    <script>
      function updateStatus() {
        var pill = document.getElementById('statusPill');
        if (!navigator.onLine) {
          pill.textContent = 'Device is currently offline';
          pill.style.background = '#FEF2F2';
          pill.style.color = '#991B1B';
        } else {
          pill.textContent = 'Network connected • Connecting to portal...';
          pill.style.background = '#ECFDF5';
          pill.style.color = '#065F46';
        }
      }

      function retryConnection() {
        var btn = document.getElementById('retryBtn');
        btn.textContent = 'Reconnecting...';
        btn.disabled = true;

        setTimeout(function () {
          if (navigator.onLine) {
            window.location.reload();
          } else {
            btn.textContent = 'Retry Connection';
            btn.disabled = false;
            updateStatus();
          }
        }, 800);
      }

      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
      updateStatus();
    </script>
  </body>
</html>
